<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>juntk.site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161b;
    --bg-elev: #171c22;
    --panel: #1a2028;
    --border: #2b3440;
    --border-strong: #3a4552;
    --accent: #3ddc97;
    --text: #eef1f4;
    --text-dim: #8a94a1;
    --text-faint: #5b6472;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      linear-gradient(var(--bg-elev) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-elev) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center top;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  .site-header {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: linear-gradient(180deg, var(--bg-elev), var(--bg));
    padding: 32px;
    margin-bottom: 24px;
    position: relative;
  }

  .site-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 60%);
  }

  .site-title {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-bottom: 8px;
  }

  .site-sub {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: .04em;
  }

  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
    position: relative;
    margin-bottom: 16px;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .rivet {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .rivet.tl { top: 8px; left: 8px; }
  .rivet.tr { top: 8px; right: 8px; }
  .rivet.bl { bottom: 8px; left: 8px; }
  .rivet.br { bottom: 8px; right: 8px; }

  @media (max-width: 520px) {
    .wrap { padding: 32px 16px 40px; }
    .site-header { padding: 20px; }
    .site-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="site-header">
    <div class="site-title">juntk.site</div>
    <div class="site-sub">TEST DEPLOYMENT</div>
  </header>

  <a href="/Board/" class="card">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>
    <div class="card-label">Dynamic / Tomcat + MariaDB</div>
    <div class="card-title">게시판 (Board)</div>
    <div class="card-desc">글을 작성하고 목록을 확인할 수 있는 테스트용 게시판입니다.</div>
  </a>


</div>

</body>
</html>
