server {

    listen 80;

    server_name posco-kry.site www.posco-kry.site;

    root /var/www/posco-kry.site;

    index index.html;

    location /Guestbook/ {
        proxy_pass http://127.0.0.1:8080/Guestbook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /Inventory/ {
        proxy_pass http://127.0.0.1:8080/Inventory/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}
